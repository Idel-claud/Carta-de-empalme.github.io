<style>
:root{--bg:#10141c;--pn:#182030;--tx:#e6ebf2;--mu:#8e9aae;--bd:#2c384c;--ac:#3d8bff}
@media(prefers-color-scheme:light){:root{--bg:#eef1f6;--pn:#fff;--tx:#1c2430;--mu:#6a7686;--bd:#ccd3de;--ac:#1e66d0}}
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;height:100dvh;display:flex;flex-direction:column}

header{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}header b{margin-right:6px}
#meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:5px;padding:5px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}#meta input{width:100%}#bm{display:none}@media(max-width:700px){#meta{display:none}#meta.on{display:grid}#bm{display:inline-block}header{gap:4px;padding:5px 6px}header b{display:none}header button{padding:4px 6px}}

#w{position:absolute;left:0;top:0;transform-origin:0 0}#sv{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}#sv .hit{pointer-events:stroke;cursor:pointer}

.h{height:32px;display:flex;gap:4px;align-items:center;padding:3px 5px;border-radius:5px 5px 0 0;cursor:move;color:#fff;white-space:nowrap}.h input,.h select{padding:1px 4px;font-size:12px;background:#0003;color:#fff;border-color:#fff4;min-width:0}.h option{color:#111}.h input{font-weight:700}
.rw{height:28px;display:flex;position:relative;border-top:1px solid var(--bd)}.rw input{flex:1;width:50%;border:0;border-radius:0;background:transparent;padding:2px 9px;font-size:13px;min-width:0}.rw input+input{text-align:right;border-left:1px solid var(--bd)}

.f{display:flex;gap:4px;padding:3px 4px;border-top:1px solid var(--bd)}.f button{padding:0 6px;font-size:11px}.bad{outline:1px solid #ff5252}

.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.br{border:1px solid var(--bd);border-radius:8px;padding:8px;margin:8px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal i{display:inline-block;width:24px;height:24px;border-radius:50%;margin:2px;cursor:pointer;border:1px solid #fff5;vertical-align:middle}
#tc{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;z-index:8;box-shadow:0 4px 14px #0007;max-width:96vw;text-align:center}#tc span{color:var(--mu);font-size:12px;margin-right:4px}#tc b{display:inline-block;padding:2px 8px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-weight:400;vertical-align:middle}
</style></head><body>
<header><b>📡 Cartas de empalme</b><button onclick="addNode('Empalme')">+ Empalme</button><button onclick="addNode('CTO')">+ CTO</button><button onclick="undo()">↶</button><button onclick="redo()">↷</button><button onclick="zoom(1.25)">＋</button><button onclick="zoom(.8)">－</button><button onclick="fit()">Ajustar</button>
<button id="bm" onclick="$('meta').classList.toggle('on');setTimeout(fit,50)">Datos ▾</button><button onclick="fijar()" title="Guarda la carta tal como te la han dado">📌 Fijar original</button><button id="bch" onclick="showCh()">Cambios</button>
<button onclick="saveJ()">Guardar JSON</button><button onclick="$('fj').click()">Cargar JSON</button><button onclick="if(confirm('¿Cargar el ejemplo? Se pierde el trabajo actual.'))load(example())">Ejemplo</button>
<button id="inst" class="p" hidden>⬇ Instalar</button><button class="p" onclick="pdf()">Exportar PDF</button><input id="fj" type="file" accept=".json" hidden onchange="rd(this)"></header>
<div id="meta"><input data-m="title" placeholder="Título"><input data-m="pon" placeholder="PON (ALCOBENDASA1.1)"><input data-m="arbol" placeholder="Árbol"><input data-m="zone" placeholder="Zona / esquema"><input data-m="fus" placeholder="Fusionador"><input data-m="rev" placeholder="Revisión"><input data-m="date" placeholder="Fecha"></div>
<div id="cv"><div id="w"></div></div>
<div id="tc" class="pal" hidden><span>Color del texto:</span><b data-c="">Auto</b></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cap1=s=>s?s[0].toUpperCase()+s.slice(1):'';
const HD=32,RH=28,CABLES=['12Fo','24Fo','48Fo','96Fo','144Fo','192Fo','288Fo','512Fo','576Fo'];
const FC={'12Fo':['azul','#1e66d0'],'24Fo':['verde','#43a047'],'48Fo':['rojo','#e53935'],'96Fo':['amarillo','#f2c200'],'144Fo':['naranja','#fb8c00'],'192Fo':['marrón','#795548'],'288Fo':['blanco','#cfd3d8'],'512Fo':['gris','#8a8f98'],'576Fo':['violeta','#8e24aa']};
const FIB=['rojo','verde','amarillo','azul','naranja','marrón','blanco','violeta','rosa','turquesa','gris','negro'];
const FIBC={rojo:'#e53935',verde:'#43a047',amarillo:'#f2c200',azul:'#1e66d0',naranja:'#fb8c00','marrón':'#8d4b1f',blanco:'#eee',violeta:'#8e24aa',rosa:'#f48fb1',turquesa:'#1fb5ad',gris:'#9e9e9e',negro:'#222'};
const MOD={'HTSC 206':'#1e66d0','HTSC512':'#7b3fc4'};
const CTOM={'Y24':'#2e7d32','Z24':'#00897b','HTTB001':'#e65100','HTTB002':'#b8860b','CDP8':'#6d4c41','MOD32':'#455a64','MOD48':'#827717','IP68 8P':'#b71c1c','IP68 16P':'#880e4f','Bandeja rack':'#424242'};
const reE=/^(?:[A-Z]{3}\d{2,3}|\d{2})E\d{4}$/i,reC=/^\d{6}[A-Z]?$/i;
let S,H=[],Rd=[],V={k:1,x:40,y:40},CM={},seq=1,con=null,dr=null,pan=null,pin=null,foc=null,typed=false;const P=new Map();
const cv=$('cv'),uid=()=>'i'+(seq++).toString(36)+Math.random().toString(36).slice(2,5),gn=id=>S.nodes.find(n=>n.id===id);
const hc=n=>n.type==='CTO'?CTOM[n.modelo]||'#2e7d32':MOD[n.modelo]||'#1e66d0',models=n=>Object.keys(n.type==='CTO'?CTOM:MOD);
const cabAt=(n,r,s)=>S.cables.find(c=>[c.a,c.b].some(p=>p.n===n&&p.r===r&&p.s===s)),big=c=>c.cap&&c.cap!=='12Fo';
// ---- medida del texto para ajustar el tamaño
const MCX=(()=>{try{return document.createElement('canvas').getContext('2d')}catch(e){return null}})();
const tw=(t,b)=>{if(!MCX)return String(t||'').length*(b?8:7.5);MCX.font=(b?'bold ':'')+'13px system-ui,sans-serif';return MCX.measureText(String(t||'')).width};
const codeW=n=>Math.max(80,tw(n.code||'código',1)*1.1+28);
function nw(n){const cell=Math.max(70,...n.rows.flatMap(r=>[tw(r.l,!!r.lc),tw(r.r,!!r.rc)]))+24,head=10+tw(n.type)+34+codeW(n)+tw(n.modelo)+34+14;return Math.ceil(Math.max(200,head,cell*2+4))}
const nh=n=>HD+n.rows.length*RH+4;
const cs=c=>c?`color:${FIBC[c]};font-weight:600;${c==='negro'?'text-shadow:0 0 3px #fff':c==='blanco'?'text-shadow:0 0 3px #000':''}`:'';
function fixModel(n){if(!models(n).includes(n.modelo))n.modelo=n.type==='CTO'?'Y24':'HTSC 206'}
function nodeNew(type,code,x,y,rows,modelo){const n={id:uid(),type,code,modelo,x,y,rows:(rows||[['',''],['','']]).map(r=>({id:uid(),l:r[0],r:r[1],lc:r[2]||'',rc:r[3]||''}))};fixModel(n);return n}
function example(){
 const A=nodeNew('Empalme','01E0486',40,60,[['SN1 1X6','OUT1','rojo'],['','OUT2'],['','OUT3'],['','OUT4'],['','OUT5'],['','OUT6']],'HTSC512');
 const D=nodeNew('Empalme','01E0358',560,210,[['IN S06','OUT1','azul'],['','OUT2'],['','OUT3']],'HTSC 206'),B=nodeNew('CTO','269147',560,20,[['IN','']],'Y24'),C=nodeNew('CTO','269272',560,110,[['IN','']],'Z24'),E=nodeNew('CTO','269273',920,210,[['IN','']],'HTTB002'),F=nodeNew('CTO','269637',920,330,[['IN','']],'MOD48');
 const k=(a,i,b,j,cap,fc,tubo)=>({id:uid(),a:{n:a.id,r:a.rows[i].id,s:'r'},b:{n:b.id,r:b.rows[j].id,s:'l'},cap,fc,tubo:tubo||'',note:''});
 return {title:'Carta de empalme',zone:'H8.1',date:new Date().toLocaleDateString('es-ES'),pon:'',arbol:'',fus:'',rev:'',mot:{},nodes:[A,B,C,D,E,F],cables:[k(A,0,B,0,'12Fo','rojo'),k(A,1,C,0,'12Fo','verde'),k(A,2,D,0,'24Fo','violeta','rojo'),k(D,0,E,0,'12Fo','rosa'),k(A,3,F,0,'12Fo','amarillo')]};}
// ---- historial y guardado
const snap=()=>JSON.stringify({nodes:S.nodes,cables:S.cables});
function pu(){H.push(snap());if(H.length>60)H.shift();Rd=[]}
function rs(o){S.nodes=o.nodes;S.cables=o.cables;render();sv()}
function undo(){if(H.length){Rd.push(snap());rs(JSON.parse(H.pop()))}}
function redo(){if(Rd.length){H.push(snap());rs(JSON.parse(Rd.pop()))}}
function sv(){cb();try{localStorage.setItem('cfusion',JSON.stringify(S))}catch(e){}}
function saveJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=(S.pon||S.zone||'carta')+'.json';a.click()}
function rd(i){const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result))}catch(e){alert('Archivo no válido')}i.value=''};r.readAsText(i.files[0])}
function load(d){if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.cables))throw new Error('formato');S=d;S.mot=S.mot||{};S.nodes.forEach(fixModel);H=[];Rd=[];document.querySelectorAll('[data-m]').forEach(i=>i.value=S[i.dataset.m]||'');render();fit();sv()}
$('meta').oninput=e=>{S[e.target.dataset.m]=e.target.value;sv()};
// ---- cambios respecto a la original
function fijar(){if(S.base&&!confirm('Ya hay una carta original fijada. ¿Sustituirla por el estado actual?'))return;S.base=snap();S.baseDate=new Date().toLocaleString('es-ES');S.mot={};render();sv()}
function cb(){const b=$('bch');if(b)b.textContent='Cambios'+(S.base?' ('+diff().length+')':'')}
function changeMap(){const m={};diff().forEach(r=>{m[r.key]=(m[r.key]==='A'||r.tipo==='Añadido')?'A':'M'});return m}
const cdesc=c=>(c.cap||'')+(big(c)&&c.tubo?' tubo '+c.tubo:'')+(c.fc?' fibra '+c.fc:'');
function diff(){
 if(!S.base)return [];const B=JSON.parse(S.base),R=[],nn=(L,id)=>L.nodes.find(n=>n.id===id);
 const ce=(L,e)=>{const n=nn(L,e.n);return (n?n.code:'?')+' · '+(e.s==='l'?'ent':'sal')+(n?n.rows.findIndex(r=>r.id===e.r)+1:'?')};
 new Set([...B.nodes,...S.nodes].map(n=>n.id)).forEach(id=>{const a=nn(B,id),b=nn(S,id);
  if(!a){R.push({key:id,elem:b.code,tipo:'Añadido',campo:'Elemento',antes:'',despues:b.type+' '+b.modelo});return}
  if(!b){R.push({key:id,elem:a.code,tipo:'Eliminado',campo:'Elemento',antes:a.type+' '+a.modelo,despues:''});return}
  [['code','Código'],['type','Tipo'],['modelo','Modelo']].forEach(([k,t])=>{if((a[k]||'')!==(b[k]||''))R.push({key:id,elem:b.code,tipo:'Modificado',campo:t,antes:a[k]||'',despues:b[k]||''})});
  new Set([...a.rows,...b.rows].map(r=>r.id)).forEach(rid=>{const x=a.rows.find(r=>r.id===rid),y=b.rows.find(r=>r.id===rid),i=b.rows.indexOf(y)+1;
   if(!x)R.push({key:id,elem:b.code,tipo:'Añadido',campo:'Fila '+i,antes:'',despues:y.l+' | '+y.r});
   else if(!y)R.push({key:id,elem:b.code,tipo:'Eliminado',campo:'Fila',antes:x.l+' | '+x.r,despues:''});
   else ['l','r'].forEach(s=>{if(x[s]!==y[s])R.push({key:id,elem:b.code,tipo:'Modificado',campo:'Fila '+i+(s==='l'?' entrada':' salida'),antes:x[s],despues:y[s]})})})});
 new Set([...B.cables,...S.cables].map(c=>c.id)).forEach(id=>{const a=B.cables.find(c=>c.id===id),b=S.cables.find(c=>c.id===id),d=(L,c)=>ce(L,c.a)+' → '+ce(L,c.b);
  if(!a)R.push({key:id,elem:ce(S,b.a),tipo:'Añadido',campo:'Cable',antes:'',despues:d(S,b)+' ('+cdesc(b)+')'});
  else if(!b)R.push({key:id,elem:ce(B,a.a),tipo:'Eliminado',campo:'Cable',antes:d(B,a)+' ('+cdesc(a)+')',despues:''});
  else[['Conexión',d(B,a),d(S,b)],['Capacidad',a.cap,b.cap],['Tubo',a.tubo,b.tubo],['Fibra',a.fc,b.fc],['Nota',a.note,b.note]].forEach(([c,x,y])=>{if((x||'')!==(y||''))R.push({key:id,elem:ce(S,b.a),tipo:'Modificado',campo:c,antes:x||'',despues:y||''})})});
 return R}
function showCh(){
 if(!S.base){alert('Primero pulsa «Fijar original» con la carta tal como te la han dado.');return}
 const R=diff(),by={},MOT=['','Fibra dañada','CTO nueva o movida','Falta de espacio','Cambio de splitter','Reserva usada','Error en la carta','Otro'];R.forEach(r=>(by[r.key]=by[r.key]||[]).push(r));
 const m=document.createElement('div');m.className='md';
 m.innerHTML='<div class="bx" style="width:620px"><b>Cambios respecto a la carta original ('+R.length+')</b>'+(Object.keys(by).length?Object.keys(by).map(k=>{const l=by[k],mo=S.mot[k]||{};return '<div class="br"><b>'+esc(l[0].elem)+'</b>'+l.slice(0,8).map(r=>'<div style="font-size:12px">'+r.tipo+' · '+esc(r.campo)+': '+esc(r.antes||'—')+' → '+esc(r.despues||'—')+'</div>').join('')+'<div class="g2"><select data-k="'+k+'" data-f="m">'+MOT.map(v=>'<option'+(v===mo.m?' selected':'')+'>'+v+'</option>').join('')+'</select><input data-k="'+k+'" data-f="n" placeholder="Nota" value="'+esc(mo.n||'')+'"></div></div>'}).join(''):'<p>Sin modificaciones.</p>')+'<div class="row"><button class="p" data-x="1">Cerrar</button></div></div>';
 m.addEventListener('change',e=>{const k=e.target.dataset.k;if(k)(S.mot[k]=S.mot[k]||{})[e.target.dataset.f]=e.target.value;sv()});
 m.onclick=e=>{if(e.target.dataset.x||e.target===m)m.remove()};document.body.appendChild(m)}
// ---- dibujo
const pt=e=>{const n=gn(e.n),i=n?n.rows.findIndex(r=>r.id===e.r):-1;return i<0?null:{x:n.x+(e.s==='r'?nw(n):0),y:n.y+2+HD+i*RH+RH/2}};
function tubeSpan(t){return `<tspan fill="${FIBC[t]||'#fff'}" font-weight="bold"${t==='negro'?' stroke="#fff" stroke-width="2.5" paint-order="stroke"':''}>${esc(cap1(t))}</tspan>`}
function cabSvg(){let o='';S.cables.forEach(c=>{const p=pt(c.a),q=pt(c.b);if(!p||!q)return;const col=(FC[c.cap]||[0,'#8a8f98'])[1],dx=Math.max(50,Math.abs(q.x-p.x)/2),
 d=`M${p.x},${p.y} C${p.x+(c.a.s==='r'?dx:-dx)},${p.y} ${q.x+(c.b.s==='r'?dx:-dx)},${q.y} ${q.x},${q.y}`,mx=(p.x+q.x)/2,my=(p.y+q.y)/2,lab=(c.cap||'').replace('Fo','f'),tb=big(c)&&c.tubo?c.tubo:'',lw=Math.ceil((lab.length+(tb?6+tb.length:0))*7.4+18);
 if(CM[c.id])o+=`<path d="${d}" fill="none" stroke="#ff6d00" stroke-width="8" opacity=".45"/>`;
 if(col==='#cfd3d8')o+=`<path d="${d}" fill="none" stroke="#8a8f98" stroke-width="5.5"/>`;
 o+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="3"/><path class="hit" data-c="${c.id}" d="${d}" fill="none" stroke="transparent" stroke-width="16"/><g transform="translate(${mx},${my})"><rect x="${-lw/2}" y="-9" width="${lw}" height="18" rx="4" fill="#10141c" stroke="${col}"/><text text-anchor="middle" y="4" font-size="11" font-family="Arial" fill="#fff">${lab}${tb?' tubo '+tubeSpan(tb):''}</text></g>`});return o}
const cables=()=>{$('sv').innerHTML=cabSvg()+'<path id="tmp" fill="none" stroke="#fff" stroke-dasharray="4"/>'};
const dc=(n,r,s)=>{const c=cabAt(n.id,r.id,s);return c?`background:${FIBC[c.fc]||'#cfd3d8'}`:''};
function nodeHtml(n){return `<div class="n${CM[n.id]?' m':''}" data-n="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${nw(n)}px"><div class="h" style="background:${hc(n)}"><select data-f="type"><option${n.type==='Empalme'?' selected':''}>Empalme</option><option${n.type==='CTO'?' selected':''}>CTO</option></select><input class="${reE.test(n.code)||reC.test(n.code)?'':'bad'}" data-f="code" placeholder="código" value="${esc(n.code)}" style="width:${codeW(n)}px"><select data-f="modelo">${models(n).map(m=>`<option${m===n.modelo?' selected':''}>${m}</option>`).join('')}</select></div>`+
 n.rows.map(r=>`<div class="rw"><i class="d l" data-d="${n.id}|${r.id}|l" style="${dc(n,r,'l')}"></i><input data-r="${r.id}" data-s="l" placeholder="entrada" value="${esc(r.l)}" style="${cs(r.lc)}"><input data-r="${r.id}" data-s="r" placeholder="salida" value="${esc(r.r)}" style="${cs(r.rc)}"><i class="d r" data-d="${n.id}|${r.id}|r" style="${dc(n,r,'r')}"></i></div>`).join('')+
 '<div class="f"><button data-a="+">+ fila</button><button data-a="-">− fila</button><button data-a="x">✕ elemento</button></div></div>'}
function render(){CM=changeMap();$('w').innerHTML='<svg id="sv"></svg>'+S.nodes.map(nodeHtml).join('');cables();ap()}
const ap=()=>$('w').style.transform=`translate(${V.x}px,${V.y}px) scale(${V.k})`;
function zoomAt(k,mx,my){k=Math.min(3,Math.max(.15,k));V.x=mx-(mx-V.x)*k/V.k;V.y=my-(my-V.y)*k/V.k;V.k=k;ap()}
function zoom(f){zoomAt(V.k*f,cv.clientWidth/2,cv.clientHeight/2)}
function fit(){if(!S.nodes.length)return;const b=S.nodes.map(n=>[n.x,n.y,n.x+nw(n),n.y+nh(n)+28]),x0=Math.min(...b.map(a=>a[0])),y0=Math.min(...b.map(a=>a[1])),x1=Math.max(...b.map(a=>a[2])),y1=Math.max(...b.map(a=>a[3])),w=cv.clientWidth,h=cv.clientHeight;
 V.k=Math.min(1.2,(w-60)/(x1-x0),(h-60)/(y1-y0));V.x=(w-(x1-x0)*V.k)/2-x0*V.k;V.y=(h-(y1-y0)*V.k)/2-y0*V.k;ap()}
function addNode(t){pu();const r=cv.getBoundingClientRect(),n=nodeNew(t,'',(r.width/2-V.x)/V.k-100,(r.height/2-V.y)/V.k-40);S.nodes.push(n);render();sv()}
// ---- interacción (ratón y táctil, con zoom de dos dedos)
