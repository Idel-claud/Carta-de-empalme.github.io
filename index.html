<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#10141c;--pn:#182030;--tx:#e6ebf2;--mu:#8e9aae;--bd:#2c384c;--ac:#3d8bff}
@media(prefers-color-scheme:light){:root{--bg:#eef1f6;--pn:#fff;--tx:#1c2430;--mu:#6a7686;--bd:#ccd3de;--ac:#1e66d0}}
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:4px 7px}button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}

.d{position:absolute;top:8px;width:11px;height:11px;border-radius:50%;background:#7a8597;border:2px solid var(--pn);cursor:crosshair;z-index:2}.d.l{left:-8px}.d.r{right:-8px}.d:hover{transform:scale(1.5)}
.f{display:flex;gap:4px;padding:3px 4px;border-top:1px solid var(--bd)}.f button{padding:0 6px;font-size:11px}.bad{outline:1px solid #e53935}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}.bx{background:var(--pn);padding:14px;border-radius:10px;border:1px solid var(--bd);width:380px;max-width:94%;max-height:88vh;overflow:auto}.bx label{display:block;margin-top:8px;color:var(--mu);font-size:12px}.bx select,.bx input{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.br{border:1px solid var(--bd);border-radius:8px;padding:8px;margin:8px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}#sw i{display:inline-block;width:22px;height:22px;border-radius:50%;margin:2px;cursor:pointer;border:1px solid #fff4}
</style></head><body>
<header><b>📡 Cartas de empalme</b><button onclick="addNode('Empalme')">+ Empalme</button><button onclick="addNode('CTO')">+ CTO</button><button onclick="undo()">↶</button><button onclick="redo()">↷</button><button onclick="fit()">Ajustar</button>
<button onclick="fijar()" title="Guarda la carta tal como te la han dado">📌 Fijar original</button><button id="bch" onclick="showCh()">Cambios</button>
<button onclick="saveJ()">Guardar JSON</button><button onclick="$('fj').click()">Cargar JSON</button><button onclick="if(confirm('¿Cargar el ejemplo? Se pierde el trabajo actual.'))load(example())">Ejemplo</button>
<button id="inst" class="p" hidden>⬇ Instalar</button><button class="p" onclick="pdf()">Exportar PDF</button><input id="fj" type="file" accept=".json" hidden onchange="rd(this)"></header>
<div id="meta"><input data-m="title" placeholder="Título"><input data-m="pon" placeholder="PON (ALCOBENDASA1.1)"><input data-m="arbol" placeholder="Árbol"><input data-m="zone" placeholder="Zona / esquema"><input data-m="fus" placeholder="Fusionador"><input data-m="rev" placeholder="Revisión"><input data-m="date" placeholder="Fecha"></div>
<div id="cv"><div id="w"></div></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=200,HD=30,RH=26,CABLES=['12Fo','24Fo','48Fo','96Fo','144Fo','192Fo','288Fo','512Fo','576Fo'];
const FC={'12Fo':['azul','#1e66d0'],'24Fo':['verde','#43a047'],'48Fo':['rojo','#e53935'],'96Fo':['amarillo','#f2c200'],'144Fo':['naranja','#fb8c00'],'192Fo':['marrón','#795548'],'288Fo':['blanco','#cfd3d8'],'512Fo':['gris','#8a8f98'],'576Fo':['violeta','#8e24aa']};
const FIB=['rojo','verde','amarillo','azul','naranja','marrón','blanco','violeta','rosa','turquesa','gris','negro'];
const FIBC={rojo:'#e53935',verde:'#43a047',amarillo:'#f2c200',azul:'#1e66d0',naranja:'#fb8c00','marrón':'#8d4b1f',blanco:'#eee',violeta:'#8e24aa',rosa:'#f48fb1',turquesa:'#1fb5ad',gris:'#9e9e9e',negro:'#222'};
const fcx=v=>FIBC[(v||'').toLowerCase().replace(/\s*\*+$/,'').trim().replace('marron','marrón')]||'';
const MOD={'HTSC 206':'#1e66d0','HTSC512':'#7b3fc4'},reE=/^(?:[A-Z]{3}\d{2,3}|\d{2})E\d{4}$/i,reC=/^\d{6}[A-Z]?$/i;
let S,H=[],Rd=[],V={k:1,x:40,y:40},CM={},seq=1,con=null,dr=null,pan=null;
const cv=$('cv'),uid=()=>'i'+(seq++).toString(36)+Math.random().toString(36).slice(2,5),gn=id=>S.nodes.find(n=>n.id===id),hc=n=>n.type==='CTO'?'#2e8b4a':MOD[n.modelo]||MOD['HTSC 206'];
const nh=n=>HD+n.rows.length*RH+4,cabAt=(n,r,s)=>S.cables.find(c=>[c.a,c.b].some(p=>p.n===n&&p.r===r&&p.s===s));
function nodeNew(type,code,x,y,rows){return {id:uid(),type,code,modelo:'HTSC 206',x,y,rows:(rows||[['',''],['','']]).map(r=>({id:uid(),l:r[0],r:r[1]}))}}
function example(){
 const A=nodeNew('Empalme','01E0486',40,60,[['SN1 1X6','OUT1'],['','OUT2'],['','OUT3'],['','OUT4'],['','OUT5'],['','OUT6']]);A.modelo='HTSC512';
 const D=nodeNew('Empalme','01E0358',560,210,[['IN1','OUT1'],['','OUT2'],['','OUT3']]),B=nodeNew('CTO','269147',560,20,[['IN','']]),C=nodeNew('CTO','269272',560,110,[['IN','']]),E=nodeNew('CTO','269273',900,210,[['IN','']]),F=nodeNew('CTO','269637',900,320,[['IN','']]);
 const k=(a,i,b,j,cap,fc)=>({id:uid(),a:{n:a.id,r:a.rows[i].id,s:'r'},b:{n:b.id,r:b.rows[j].id,s:'l'},cap,fc,note:''});
 return {title:'Carta de empalme',zone:'H8.1',date:new Date().toLocaleDateString('es-ES'),pon:'',arbol:'',fus:'',rev:'',mot:{},nodes:[A,B,C,D,E,F],cables:[k(A,0,B,0,'12Fo','rojo'),k(A,1,C,0,'12Fo','verde'),k(A,2,D,0,'24Fo','violeta'),k(D,0,E,0,'12Fo','rosa'),k(A,3,F,0,'12Fo','amarillo')]};}
// ---- historial y guardado
const snap=()=>JSON.stringify({nodes:S.nodes,cables:S.cables});
function pu(){H.push(snap());if(H.length>60)H.shift();Rd=[]}
function rs(o){S.nodes=o.nodes;S.cables=o.cables;render();sv()}
function undo(){if(H.length){Rd.push(snap());rs(JSON.parse(H.pop()))}}
function redo(){if(Rd.length){H.push(snap());rs(JSON.parse(Rd.pop()))}}
function sv(){cb();try{localStorage.setItem('cfusion',JSON.stringify(S))}catch(e){}}
function saveJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=(S.pon||S.zone||'carta')+'.json';a.click()}
function rd(i){const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result))}catch(e){alert('Archivo no válido')}i.value=''};r.readAsText(i.files[0])}
function load(d){S=d;S.mot=S.mot||{};H=[];Rd=[];document.querySelectorAll('[data-m]').forEach(i=>i.value=S[i.dataset.m]||'');render();fit();sv()}
$('meta').oninput=e=>{S[e.target.dataset.m]=e.target.value;sv()};
// ---- cambios respecto a la original
function fijar(){if(S.base&&!confirm('Ya hay una carta original fijada. ¿Sustituirla por el estado actual?'))return;S.base=snap();S.baseDate=new Date().toLocaleString('es-ES');S.mot={};render();sv()}
function cb(){const b=$('bch');if(b)b.textContent='Cambios'+(S.base?' ('+diff().length+')':'')}
function changeMap(){const m={};diff().forEach(r=>{m[r.key]=(m[r.key]==='A'||r.tipo==='Añadido')?'A':'M'});return m}
function diff(){
 if(!S.base)return [];const B=JSON.parse(S.base),R=[],nn=(L,id)=>L.nodes.find(n=>n.id===id);
 const ce=(L,e)=>{const n=nn(L,e.n);return (n?n.code:'?')+' · '+(e.s==='l'?'ent':'sal')+(n?n.rows.findIndex(r=>r.id===e.r)+1:'?')};
 new Set([...B.nodes,...S.nodes].map(n=>n.id)).forEach(id=>{const a=nn(B,id),b=nn(S,id);
  if(!a){R.push({key:id,elem:b.code,tipo:'Añadido',campo:'Elemento',antes:'',despues:b.type});return}
  if(!b){R.push({key:id,elem:a.code,tipo:'Eliminado',campo:'Elemento',antes:a.type,despues:''});return}
  [['code','Código'],['type','Tipo'],['modelo','Modelo']].forEach(([k,t])=>{if((a[k]||'')!==(b[k]||'')&&!(k==='modelo'&&b.type==='CTO'))R.push({key:id,elem:b.code,tipo:'Modificado',campo:t,antes:a[k]||'',despues:b[k]||''})});
  new Set([...a.rows,...b.rows].map(r=>r.id)).forEach(rid=>{const x=a.rows.find(r=>r.id===rid),y=b.rows.find(r=>r.id===rid),i=b.rows.indexOf(y)+1;
   if(!x)R.push({key:id,elem:b.code,tipo:'Añadido',campo:'Fila '+i,antes:'',despues:y.l+' | '+y.r});
   else if(!y)R.push({key:id,elem:b.code,tipo:'Eliminado',campo:'Fila',antes:x.l+' | '+x.r,despues:''});
   else ['l','r'].forEach(s=>{if(x[s]!==y[s])R.push({key:id,elem:b.code,tipo:'Modificado',campo:'Fila '+i+(s==='l'?' entrada':' salida'),antes:x[s],despues:y[s]})})})});
 new Set([...B.cables,...S.cables].map(c=>c.id)).forEach(id=>{const a=B.cables.find(c=>c.id===id),b=S.cables.find(c=>c.id===id),d=(L,c)=>ce(L,c.a)+' → '+ce(L,c.b);
  if(!a)R.push({key:id,elem:ce(S,b.a),tipo:'Añadido',campo:'Cable',antes:'',despues:d(S,b)+' ('+(b.cap||'')+(b.fc?' '+b.fc:'')+')'});
  else if(!b)R.push({key:id,elem:ce(B,a.a),tipo:'Eliminado',campo:'Cable',antes:d(B,a),despues:''});
  else[['Conexión',d(B,a),d(S,b)],['Capacidad',a.cap,b.cap],['Fibra',a.fc,b.fc],['Nota',a.note,b.note]].forEach(([c,x,y])=>{if((x||'')!==(y||''))R.push({key:id,elem:ce(S,b.a),tipo:'Modificado',campo:c,antes:x||'',despues:y||''})})});
 return R}
function showCh(){
 if(!S.base){alert('Primero pulsa «Fijar original» con la carta tal como te la han dado.');return}
 const R=diff(),by={},MOT=['','Fibra dañada','CTO nueva o movida','Falta de espacio','Cambio de splitter','Reserva usada','Error en la carta','Otro'];R.forEach(r=>(by[r.key]=by[r.key]||[]).push(r));
 const m=document.createElement('div');m.className='md';
 m.innerHTML='<div class="bx" style="width:620px"><b>Cambios respecto a la carta original ('+R.length+')</b>'+(Object.keys(by).length?Object.keys(by).map(k=>{const l=by[k],mo=S.mot[k]||{};return '<div class="br"><b>'+esc(l[0].elem)+'</b>'+l.slice(0,8).map(r=>'<div style="font-size:12px">'+r.tipo+' · '+esc(r.campo)+': '+esc(r.antes||'—')+' → '+esc(r.despues||'—')+'</div>').join('')+'<div class="g2"><select data-k="'+k+'" data-f="m">'+MOT.map(v=>'<option'+(v===mo.m?' selected':'')+'>'+v+'</option>').join('')+'</select><input data-k="'+k+'" data-f="n" placeholder="Nota" value="'+esc(mo.n||'')+'"></div></div>'}).join(''):'<p>Sin modificaciones.</p>')+'<div class="row"><button class="p" data-x="1">Cerrar</button></div></div>';
 m.addEventListener('change',e=>{const k=e.target.dataset.k;if(k)(S.mot[k]=S.mot[k]||{})[e.target.dataset.f]=e.target.value;sv()});
 m.onclick=e=>{if(e.target.dataset.x||e.target===m)m.remove()};document.body.appendChild(m)}
// ---- dibujo
const pt=e=>{const n=gn(e.n),i=n?n.rows.findIndex(r=>r.id===e.r):-1;return i<0?null:{x:n.x+(e.s==='r'?W:0),y:n.y+HD+2+i*RH+13.5}};
function cabSvg(){let o='';S.cables.forEach(c=>{const p=pt(c.a),q=pt(c.b);if(!p||!q)return;const col=(FC[c.cap]||[0,'#8a8f98'])[1],dx=Math.max(50,Math.abs(q.x-p.x)/2),
 d=`M${p.x},${p.y} C${p.x+(c.a.s==='r'?dx:-dx)},${p.y} ${q.x+(c.b.s==='r'?dx:-dx)},${q.y} ${q.x},${q.y}`,mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
 if(CM[c.id])o+=`<path d="${d}" fill="none" stroke="#ff6d00" stroke-width="8" opacity=".45"/>`;
 if(col==='#cfd3d8')o+=`<path d="${d}" fill="none" stroke="#8a8f98" stroke-width="5.5"/>`;
 o+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="3"/><path class="hit" data-c="${c.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14"/><g transform="translate(${mx},${my})"><rect x="-17" y="-8" width="34" height="16" rx="4" fill="#10141c" stroke="${col}"/><text text-anchor="middle" y="4" font-size="10" font-family="Arial" fill="#fff">${(c.cap||'').replace('Fo','f')}</text></g>`});return o}
const cables=()=>{$('sv').innerHTML=cabSvg()+'<path id="tmp" fill="none" stroke="#fff" stroke-dasharray="4"/>'};
const dc=(n,r,s)=>{const c=cabAt(n.id,r.id,s);return c?`background:${fcx(c.fc)||'#cfd3d8'}`:''};
function nodeHtml(n){return `<div class="n${CM[n.id]?' m':''}" data-n="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="h" style="background:${hc(n)}"><select data-f="type"><option${n.type==='Empalme'?' selected':''}>Empalme</option><option${n.type==='CTO'?' selected':''}>CTO</option></select><input class="${reE.test(n.code)||reC.test(n.code)?'':'bad'}" data-f="code" placeholder="código" value="${esc(n.code)}">${n.type==='Empalme'?`<select data-f="modelo">${Object.keys(MOD).map(m=>`<option${m===n.modelo?' selected':''}>${m}</option>`).join('')}</select>`:''}</div>`+
 n.rows.map(r=>`<div class="rw"><i class="d l" data-d="${n.id}|${r.id}|l" style="${dc(n,r,'l')}"></i><input data-r="${r.id}" data-s="l" placeholder="entrada" value="${esc(r.l)}"><input data-r="${r.id}" data-s="r" placeholder="salida" value="${esc(r.r)}"><i class="d r" data-d="${n.id}|${r.id}|r" style="${dc(n,r,'r')}"></i></div>`).join('')+
 '<div class="f"><button data-a="+">+ fila</button><button data-a="-">− fila</button><button data-a="x">✕ elemento</button></div></div>'}
function render(){CM=changeMap();$('w').innerHTML='<svg id="sv"></svg>'+S.nodes.map(nodeHtml).join('');cables();ap()}
const ap=()=>$('w').style.transform=`translate(${V.x}px,${V.y}px) scale(${V.k})`;
function fit(){if(!S.nodes.length)return;const b=S.nodes.map(n=>[n.x,n.y,n.x+W,n.y+nh(n)+24]),x0=Math.min(...b.map(a=>a[0])),y0=Math.min(...b.map(a=>a[1])),x1=Math.max(...b.map(a=>a[2])),y1=Math.max(...b.map(a=>a[3])),w=cv.clientWidth,h=cv.clientHeight;
 V.k=Math.min(1.2,(w-60)/(x1-x0),(h-60)/(y1-y0));V.x=(w-(x1-x0)*V.k)/2-x0*V.k;V.y=(h-(y1-y0)*V.k)/2-y0*V.k;ap()}
function addNode(t){pu();const r=cv.getBoundingClientRect(),n=nodeNew(t,'',(r.width/2-V.x)/V.k-W/2,(r.height/2-V.y)/V.k-40);S.nodes.push(n);render();sv()}
// ---- interacción
const wp=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k}};
cv.addEventListener('pointerdown',e=>{const t=e.target,d=t.closest('[data-d]'),h=t.closest('.h');
 if(d){e.preventDefault();const[n,r,s]=d.dataset.d.split('|');con={n,r,s};cv.setPointerCapture(e.pointerId);return}
 if(h&&!/INPUT|SELECT/.test(t.tagName)){const n=gn(h.closest('.n').dataset.n),p=wp(e);dr={n,ox:p.x-n.x,oy:p.y-n.y,mv:0};cv.setPointerCapture(e.pointerId);return}
 if(t.closest('.n')||t.classList.contains('hit'))return;pan={x:e.clientX-V.x,y:e.clientY-V.y};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
 if(dr){if(!dr.mv){pu();dr.mv=1}const p=wp(e);dr.n.x=Math.round(p.x-dr.ox);dr.n.y=Math.round(p.y-dr.oy);const el=document.querySelector(`[data-n="${dr.n.id}"]`);el.style.left=dr.n.x+'px';el.style.top=dr.n.y+'px';cables()}
 else if(pan){V.x=e.clientX-pan.x;V.y=e.clientY-pan.y;ap()}
 else if(con){const a=pt(con),q=wp(e),t=$('tmp');if(a&&t)t.setAttribute('d',`M${a.x},${a.y} L${q.x},${q.y}`)}});
cv.addEventListener('pointerup',e=>{
 if(con){const t=document.elementFromPoint(e.clientX,e.clientY),d=t&&t.closest&&t.closest('[data-d]');
  if(d){const[n,r,s]=d.dataset.d.split('|');if(!(n===con.n&&r===con.r&&s===con.s)){pu();const dup=(a,b,c)=>S.cables.filter(x=>![x.a,x.b].some(p=>(p.n===a&&p.r===b&&p.s===c)));
   S.cables=dup(con.n,con.r,con.s);S.cables=S.cables.filter(x=>![x.a,x.b].some(p=>p.n===n&&p.r===r&&p.s===s));
   S.cables.push({id:uid(),a:{n:con.n,r:con.r,s:con.s},b:{n,r,s},cap:'12Fo',fc:'',note:''});render();sv()}}else cables()}
 if(dr&&dr.mv)sv();con=dr=pan=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.min(3,Math.max(.15,V.k*(e.deltaY<0?1.12:.89)));V.x=mx-(mx-V.x)*k/V.k;V.y=my-(my-V.y)*k/V.k;V.k=k;ap()},{passive:false});
$('w').addEventListener('change',e=>{const t=e.target,nd=t.closest('.n');if(!nd)return;const n=gn(nd.dataset.n);pu();
 if(t.dataset.f){n[t.dataset.f]=t.value;if(t.dataset.f==='code'){t.classList.toggle('bad',!(reE.test(n.code)||reC.test(n.code)));nd.classList.toggle('m',!!changeMap()[n.id]);sv()}else{render();sv()}}
 else if(t.dataset.r){n.rows.find(r=>r.id===t.dataset.r)[t.dataset.s]=t.value;nd.classList.toggle('m',!!changeMap()[n.id]);sv()}});
$('w').addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){editCable(c.dataset.c);return}
 const b=e.target.closest('[data-a]');if(!b)return;const n=gn(b.closest('.n').dataset.n),a=b.dataset.a;
 if(a==='+'){pu();n.rows.push({id:uid(),l:'',r:''})}
 else if(a==='-'){if(n.rows.length<2)return;pu();const r=n.rows.pop();S.cables=S.cables.filter(c=>![c.a,c.b].some(p=>p.n===n.id&&p.r===r.id))}
 else{if(!confirm('¿Eliminar '+(n.code||'el elemento')+'?'))return;pu();S.nodes=S.nodes.filter(x=>x!==n);S.cables=S.cables.filter(c=>c.a.n!==n.id&&c.b.n!==n.id)}
 render();sv()});
